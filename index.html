<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <!-- CSP：只放行页面真正会连的域名 ——
         字体（Google Fonts）、统计（百度 / Clarity / GoatCounter）、
         两块 GitHub 数据（仓库信息与贡献记录）。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://hm.baidu.com https://www.clarity.ms https://gc.zgo.at; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https: blob:; connect-src 'self' https://hm.baidu.com https://www.clarity.ms https://gc.zgo.at https://*.goatcounter.com https://api.github.com https://github-contributions-api.jogruber.de; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>琉璃幻影 · Glazed Mirage</title>
    <meta
      name="description"
      content="琉璃幻影的技术作品与手记：本地优先的写作工具玉笺、从零实现的存储引擎 GojiDB、零依赖的浏览器新标签页 Lucent。"
    />
    <meta name="author" content="琉璃幻影" />
    <meta name="theme-color" content="#EDE8DD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191714" media="(prefers-color-scheme: dark)" />

    <!-- 衬线字体异步加载：普通 <link rel=stylesheet> 会阻塞脚本，
         而 fonts.googleapis.com 在本地网络下时常不可达，一卡就是几十秒，
         入场动画、冰裂、换地色会集体失效，页面看着像坏了。
         media="print" 既不阻塞渲染也不阻塞脚本，加载完再切回 all。
         兜底字体栈已备好系统中文衬线，最坏情况只是衬线略变，功能不受影响 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+SC:wght@300;400;600;900&display=swap"
    />
