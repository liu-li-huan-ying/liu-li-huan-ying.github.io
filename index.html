<!doctype html>
<html lang="zh-CN" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <!-- CSP：只放行页面真正会连的域名 ——
         统计（百度 / Clarity / GoatCounter）、两块 GitHub 数据（仓库信息与贡献记录）。
         字体已经自托管（public/fonts，同源），不再需要放行任何第三方字体域。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://hm.baidu.com https://www.clarity.ms https://gc.zgo.at; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https: blob:; connect-src 'self' https://hm.baidu.com https://www.clarity.ms https://gc.zgo.at https://*.goatcounter.com https://api.github.com https://github-contributions-api.jogruber.de; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>琉璃幻影 · Glazed Mirage</title>
    <meta
      name="description"
      content="琉璃幻影的技术作品与手记：本地优先的写作工具玉笺、从零实现的存储引擎 GojiDB、零依赖的浏览器新标签页 Lucent。"
    />
    <meta name="author" content="琉璃幻影" />
    <meta name="theme-color" content="#EDE8DD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191714" media="(prefers-color-scheme: dark)" />

    <!-- 字体自托管：public/fonts 下的 woff2 是按站点实际用字子集化过的。
         分档与字重全在 src/styles/fonts.css（生成物），
         重做字体：npm run build:fonts（见 README「字体」一节）
         这里刻意不 preload：实测 preload 会让这条高优先级请求去抢
         渲染阻塞的 CSS/JS 的带宽，Lighthouse 模拟 1.6Mbps 下 FCP 从 2.3s 涨到 8.6s，
         得不偿失。字体与样式表同源，本来就在同一条连接上排队，不缺那一次提前。 -->

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:url" content="https://liu-li-huan-ying.github.io/" />
    <meta property="og:title" content="琉璃幻影 · Glazed Mirage" />
    <meta
      property="og:description"
      content="写存储、性能，以及一些与代码无关的书。作品与手记，卷在这里。"
    />
    <meta property="og:image" content="https://liu-li-huan-ying.github.io/og-image.png" />
    <meta property="og:site_name" content="琉璃幻影" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="琉璃幻影 · Glazed Mirage" />
    <meta
      name="twitter:description"
      content="写存储、性能，以及一些与代码无关的书。"
    />
    <meta name="twitter:image" content="https://liu-li-huan-ying.github.io/og-image.png" />

    <link rel="canonical" href="https://liu-li-huan-ying.github.io/" />

    <script type="application/ld+json">

        "@context": "https://schema.org",

        "name": "琉璃幻影",

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="琉璃幻影 · RSS"
      href="/rss.xml"
    />
